name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tools
        run: python -m pip install pip-audit==2.7.3 cyclonedx-bom==5.1.1
      - name: Audit Python dependencies
        run: make security-audit
      - name: Generate Python SBOM
        run: make sbom-python

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.7
      - name: Build service and tool images
        run: docker compose -f deploy/docker-compose.control.yml build
      - name: Scan service and tool images
        run: make image-scan
      - name: Generate image SBOMs
        run: make sbom-images
