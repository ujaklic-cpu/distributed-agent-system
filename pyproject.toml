[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-agent-system"
version = "0.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker Compose or external services",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "workspaces",
    "artifacts",
    "logs",
    "orchestrator/migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports and undefined names
    "I",   # import sorting
    "B",   # bugbear: common mistakes
    "UP",  # pyupgrade
    "SIM", # simplify repeated or overly complex constructs
]
ignore = [
    "E501", # formatter owns wrapping; long prompts and JSON fixtures are intentional
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = [
    "workspaces/",
    "artifacts/",
    "logs/",
    "orchestrator/migrations/",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = ["workspaces", "artifacts", "logs", "orchestrator/migrations"]

[tool.setuptools]
packages = ["shared", "orchestrator", "node_agent", "agent_server"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[[tool.mypy.overrides]]
module = [
    "orchestrator.app",
    "orchestrator.registry",
    "orchestrator.state_machine",
    "orchestrator.task_queue",
    "node_agent.app",
    "node_agent.docker_manager",
    "node_agent.heartbeat",
]
ignore_errors = true
